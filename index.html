<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja Scripts</title>
    <!-- Favicon corrigido (SVG de uma Shuriken/Espada para não bugar no Windows) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B5CF6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M14.5 17.5L3 6V3h3l11.5 11.5'/><path d='M13 19l6-6'/><path d='M16 16l4 4'/><path d='M19 21l2-2'/><path d='M11 9L8 12'/></svg>">
    
    <!-- Fonte bonita do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-color: #09090b;
            --panel-bg: #18181b;
            --panel-hover: #27272a;
            --text-main: #fafafa;
            --text-muted: #a1a1aa;
            --accent: #8b5cf6;
            --accent-hover: #7c3aed;
            --border: #27272a;
            --danger: #ef4444;
            --danger-hover: #dc2626;
        }
        
        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
        }

        /* --- Header & Logo --- */
        .header {
            background-color: var(--panel-bg);
            border-radius: 16px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .logo-area {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo-svg {
            background: linear-gradient(135deg, #8b5cf6, #d946ef);
            border-radius: 12px;
            width: 48px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
        }
        
        .title h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .sync-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #10b981;
            font-weight: 600;
            margin-top: 4px;
        }
        
        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            box-shadow: 0 0 8px #10b981;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- Auth & User Controls --- */
        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        
        .user-info {
            display: none;
            align-items: center;
            gap: 12px;
        }
        
        .user-email {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* --- Buttons --- */
        .btn-primary {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
        }
        .btn-primary:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }
        
        .btn-outline {
            background-color: transparent;
            color: white;
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }
        .btn-outline:hover {
            background-color: var(--panel-hover);
        }

        /* --- Search & Tabs --- */
        .search-bar {
            width: 100%;
            padding: 14px 20px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 24px;
            transition: border-color 0.2s;
        }
        .search-bar:focus {
            outline: none;
            border-color: var(--accent);
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 8px;
        }
        .tabs::-webkit-scrollbar { height: 6px; }
        .tabs::-webkit-scrollbar-track { background: var(--bg-color); border-radius: 4px; }
        .tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .tab {
            padding: 8px 16px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.2s;
        }
        .tab.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(139, 92, 246, 0.3);
        }
        .tab:hover:not(.active) {
            background-color: var(--panel-hover);
            color: white;
        }

        /* --- Scripts Area --- */
        .script-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        
        .script-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .script-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border-color: #3f3f46;
        }
        
        .script-info h3 { margin: 0 0 8px 0; font-size: 18px; font-weight: 600; }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            background: #27272a;
            color: #d4d4d8;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .action-btns { display: flex; gap: 10px; }
        
        .btn-delete {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
            display: none; /* Hidden by default */
        }
        .btn-delete:hover {
            background-color: rgba(239, 68, 68, 0.1);
            border-color: var(--danger);
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            background: var(--panel-bg);
            border-radius: 16px;
            border: 1px dashed var(--border);
        }

        /* --- Modals --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: var(--panel-bg);
            padding: 32px;
            border-radius: 20px;
            width: 420px;
            max-width: 90%;
            border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            transform: scale(0.95);
            animation: modalFadeIn 0.2s forwards;
        }
        @keyframes modalFadeIn {
            to { transform: scale(1); opacity: 1; }
        }
        .modal h2 { margin-top: 0; font-size: 22px; margin-bottom: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #d4d4d8; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 12px; border-radius: 8px; background: var(--bg-color); border: 1px solid var(--border); color: white; box-sizing: border-box; font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--accent);
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 28px; }
        
        .footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 50px;
            padding-bottom: 20px;
        }
        .footer span { cursor: pointer; color: var(--text-muted); transition: 0.2s; }
        .footer span:hover { color: white; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="logo-area">
            <div class="logo-svg">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M11 9L8 12"/></svg>
            </div>
            <div class="title">
                <h1>Ninja Scripts</h1>
                <div class="sync-status">
                    <div class="dot"></div> Nuvem Sincronizada
                </div>
            </div>
        </div>
        
        <div class="header-actions" id="guestActions">
            <button class="btn-outline" onclick="openAuthModal('login')">Entrar</button>
            <button class="btn-primary" onclick="openAuthModal('register')">Criar Conta</button>
        </div>
        
        <div class="user-info" id="userActions">
            <span class="user-email" id="userEmailDisplay"></span>
            <button class="btn-outline" onclick="logout()">Sair</button>
            <button class="btn-primary" onclick="openScriptModal()">+ Postar Script</button>
        </div>
    </div>

    <input type="text" class="search-bar" placeholder="Buscar por nome ou jogo..." id="searchInput" onkeyup="filterScripts()">

    <div class="tabs" id="categoryTabs">
        <div class="tab active" onclick="setCategory('Todos')">Todos</div>
        <div class="tab" onclick="setCategory('Blox Fruits')">Blox Fruits</div>
        <div class="tab" onclick="setCategory('Roube um Ovo')">Roube um Ovo</div>
        <div class="tab" onclick="setCategory('Adopt Me!')">Adopt Me!</div>
        <div class="tab" onclick="setCategory('Brookhaven 🏡RP')">Brookhaven 🏡RP</div>
        <div class="tab" onclick="setCategory('Tower of Hell')">Tower of Hell</div>
        <div class="tab" onclick="setCategory('Murder Mystery 2')">Murder Mystery 2</div>
        <div class="tab" onclick="setCategory('Piggy')">Piggy</div>
        <div class="tab" onclick="setCategory('Arsenal')">Arsenal</div>
        <div class="tab" onclick="setCategory('Jailbreak')">Jailbreak</div>
    </div>

    <div id="contentArea">
        <div class="empty-state">Carregando scripts da nuvem...</div>
    </div>

    <div class="footer">
        Desenvolvido com Supabase & Vercel <br><br>
        <span onclick="toggleAdmin()">🔒 Acesso Admin (Dono)</span>
    </div>
</div>

<!-- Modal de Auth -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <h2 id="authTitle">Entrar</h2>
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="authEmail" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label>Senha</label>
            <input type="password" id="authPassword" placeholder="******">
        </div>
        <div class="modal-actions">
            <button class="btn-outline" onclick="closeAuthModal()">Cancelar</button>
            <button class="btn-primary" id="authSubmitBtn" onclick="handleAuth()">Confirmar</button>
        </div>
    </div>
</div>

<!-- Modal de Adicionar Script -->
<div class="modal-overlay" id="scriptModal">
    <div class="modal">
        <h2>Adicionar Novo Script</h2>
        <div class="form-group">
            <label>Nome do Script</label>
            <input type="text" id="scriptName" placeholder="Ex: Auto Farm Level Max">
        </div>
        <div class="form-group">
            <label>Jogo</label>
            <select id="scriptGame">
                <option value="Blox Fruits">Blox Fruits</option>
                <option value="Roube um Ovo">Roube um Ovo</option>
                <option value="Adopt Me!">Adopt Me!</option>
                <option value="Brookhaven 🏡RP">Brookhaven 🏡RP</option>
                <option value="Tower of Hell">Tower of Hell</option>
                <option value="Murder Mystery 2">Murder Mystery 2</option>
                <option value="Piggy">Piggy</option>
                <option value="Arsenal">Arsenal</option>
                <option value="Jailbreak">Jailbreak</option>
                <option value="Outros">Outros</option>
            </select>
        </div>
        <div class="form-group">
            <label>Código do Script</label>
            <textarea id="scriptCode" rows="4" placeholder="Cole o código lua aqui..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-outline" onclick="closeScriptModal()">Cancelar</button>
            <button class="btn-primary" onclick="saveScript()">Salvar na Nuvem</button>
        </div>
    </div>
</div>

<script>
    // Conexão com o Supabase usando as chaves fornecidas
    const SUPABASE_URL = 'https://qdrqqyrkbvzpschcdlws.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Ukvl_bK8a0okV6Z_7Fc0xA_nU_y5Yk8';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let scriptsData = [];
    let currentCategory = 'Todos';
    let isAdmin = false;
    let currentUser = null;
    let authMode = 'login'; // 'login' ou 'register'

    // --- Autenticação ---
    async function checkUser() {
        const { data: { session } } = await supabase.auth.getSession();
        currentUser = session ? session.user : null;
        updateUI();
    }

    supabase.auth.onAuthStateChange((event, session) => {
        currentUser = session ? session.user : null;
        updateUI();
    });

    function updateUI() {
        if (currentUser) {
            document.getElementById('guestActions').style.display = 'none';
            document.getElementById('userActions').style.display = 'flex';
            document.getElementById('userEmailDisplay').innerText = currentUser.email;
        } else {
            document.getElementById('guestActions').style.display = 'flex';
            document.getElementById('userActions').style.display = 'none';
        }
    }

    function openAuthModal(mode) {
        authMode = mode;
        document.getElementById('authTitle').innerText = mode === 'login' ? 'Entrar na Conta' : 'Criar Nova Conta';
        document.getElementById('authSubmitBtn').innerText = mode === 'login' ? 'Entrar' : 'Cadastrar';
        document.getElementById('authModal').style.display = 'flex';
    }

    function closeAuthModal() {
        document.getElementById('authModal').style.display = 'none';
        document.getElementById('authEmail').value = '';
        document.getElementById('authPassword').value = '';
    }

    async function handleAuth() {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;
        
        if (!email || !password) return alert('Preencha todos os campos!');

        let error;
        if (authMode === 'register') {
            const { error: signUpError } = await supabase.auth.signUp({ email, password });
            error = signUpError;
            if (!error) alert('Conta criada! Você já pode entrar.');
        } else {
            const { error: signInError } = await supabase.auth.signInWithPassword({ email, password });
            error = signInError;
        }

        if (error) {
            alert('Erro: ' + error.message);
        } else {
            closeAuthModal();
        }
    }

    async function logout() {
        await supabase.auth.signOut();
    }

    // --- Funções de Banco de Dados (Supabase) ---
    async function fetchScripts() {
        const { data, error } = await supabase
            .from('scripts')
            .select('*')
            .order('id', { ascending: false });
            
        if (error) {
            console.error('Erro ao buscar scripts:', error);
            document.getElementById('contentArea').innerHTML = `<div class="empty-state">Erro ao carregar o banco de dados.</div>`;
            return;
        }
        
        scriptsData = data || [];
        filterScripts();
    }

    async function saveScript() {
        if (!currentUser) return alert('Você precisa criar conta e entrar para postar scripts!');
        
        const name = document.getElementById('scriptName').value;
        const game = document.getElementById('scriptGame').value;
        const code = document.getElementById('scriptCode').value;

        if(!name || !code) return alert('Preencha o nome e o código!');

        document.getElementById('scriptModal').style.display = 'none';
        
        const { error } = await supabase
            .from('scripts')
            .insert([{ name, game, code }]);

        if (error) {
            alert('Erro ao salvar no Supabase!');
            console.error(error);
        } else {
            document.getElementById('scriptName').value = '';
            document.getElementById('scriptCode').value = '';
            fetchScripts(); // recarrega a lista
        }
    }

    async function deleteScript(id) {
        if (!isAdmin) return alert('Somente o dono pode apagar scripts!');
        
        if(confirm('Tem certeza que deseja apagar permanentemente da nuvem?')) {
            const { error } = await supabase
                .from('scripts')
                .delete()
                .eq('id', id);
                
            if (!error) fetchScripts();
        }
    }

    // --- Interface & UX ---
    function toggleAdmin() {
        if (isAdmin) {
            isAdmin = false;
            alert('Modo Dono desativado.');
        } else {
            const pass = prompt('Senha do Dono:');
            if (pass === 'ninja123') {
                isAdmin = true;
                alert('Modo Dono ativado! Você pode apagar scripts agora.');
            } else if (pass) {
                alert('Senha incorreta!');
            }
        }
        filterScripts(); // atualiza a tela
    }

    function openScriptModal() {
        if (!currentUser) return alert('Crie uma conta ou faça login primeiro!');
        document.getElementById('scriptModal').style.display = 'flex';
    }

    function closeScriptModal() {
        document.getElementById('scriptModal').style.display = 'none';
    }
    
    function copyScript(btn, codeBase64) {
        const code = decodeURIComponent(escape(atob(codeBase64)));
        navigator.clipboard.writeText(code);
        const originalText = btn.innerText;
        btn.innerText = 'Copiado!';
        btn.style.borderColor = '#10b981';
        btn.style.color = '#10b981';
        setTimeout(() => {
            btn.innerText = originalText;
            btn.style.borderColor = 'var(--border)';
            btn.style.color = 'white';
        }, 2000);
    }

    function setCategory(cat) {
        currentCategory = cat;
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.toggle('active', t.innerText === cat);
        });
        filterScripts();
    }

    function filterScripts() {
        const search = document.getElementById('searchInput').value.toLowerCase();
        const area = document.getElementById('contentArea');
        
        let filtered = scriptsData.filter(s => {
            const matchesSearch = s.name.toLowerCase().includes(search) || s.game.toLowerCase().includes(search);
            const matchesCat = currentCategory === 'Todos' || s.game === currentCategory;
            return matchesSearch && matchesCat;
        });

        if (filtered.length === 0) {
            area.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📂</div>
                    <h3 style="margin-bottom: 8px;">Nenhum script encontrado</h3>
                    <p>Faça login e seja o primeiro a postar!</p>
                </div>
            `;
            return;
        }

        let html = '<div class="script-list">';
        filtered.forEach(s => {
            const safeCode = btoa(unescape(encodeURIComponent(s.code)));
            // Só mostra o botão de apagar se for o admin
            const deleteBtnStyle = isAdmin ? 'display: block;' : 'display: none;';

            html += `
                <div class="script-card">
                    <div class="script-info">
                        <h3>${s.name}</h3>
                        <span class="tag">${s.game}</span>
                    </div>
                    <div class="action-btns">
                        <button class="btn-outline" onclick="copyScript(this, '${safeCode}')">Copiar Script</button>
                        <button class="btn-delete" style="${deleteBtnStyle}" onclick="deleteScript(${s.id})">Apagar (Admin)</button>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        area.innerHTML = html;
    }

    // Iniciar
    checkUser();
    fetchScripts();
</script>
</body>
</html>
